name: Verify

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
          cache-dependency-path: src-tauri/worker-go/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Audit frontend dependencies
        run: bun audit

      - name: Build frontend
        run: bun run build

      - name: Run frontend tests
        run: bun run test:frontend

      - name: Build worker sidecar
        run: bun run build-sidecar

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

      - name: Check Go formatting
        working-directory: src-tauri/worker-go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet Go worker
        working-directory: src-tauri/worker-go
        run: go vet ./...

      - name: Run Go worker tests
        working-directory: src-tauri/worker-go
        run: go test -race ./...

      - name: Audit Go worker dependencies
        working-directory: src-tauri/worker-go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
