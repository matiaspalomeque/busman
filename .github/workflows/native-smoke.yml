name: Packaged native smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-latest
            bundles: appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
          cache-dependency-path: src-tauri/worker-go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 gnome-keyring
      - run: bun install --frozen-lockfile
      - name: Build packaged debug candidate
        run: bun run tauri build --debug --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Check native bootstrap (macOS and Windows)
        if: runner.os != 'Linux'
        run: python scripts/run-native-smoke.py --report native-smoke.json
      - name: Check native bootstrap (Linux desktop session)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c 'printf "\n" | gnome-keyring-daemon --unlock --components=secrets; xvfb-run -a python scripts/run-native-smoke.py --report native-smoke.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-${{ runner.os }}-${{ github.sha }}
          path: native-smoke.json
          retention-days: 14
